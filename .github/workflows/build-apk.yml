name: Build Linkbuster APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --org com.cryfsall --project-name linkbuster /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      - name: Apply overlay (manifest)
        run: cp overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Linkbuster.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cfs-linkbuster-apk
          path: Linkbuster.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Linkbuster v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: Linkbuster.apk
          make_latest: true
